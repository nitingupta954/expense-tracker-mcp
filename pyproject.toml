[project]
name = "expense-tracker-mcp-server"
version = "0.1.0"
description = "An MCP server exposing a full-featured expense tracker (add, list, edit, delete, budget, report) over the Model Context Protocol."
readme = "README.md"
authors = [
    { name = "nitingupta95", email = "ng61315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastmcp>=3.4.5",
    "pydantic>=2.0",
]

[project.scripts]
expense-tracker-mcp = "expense_tracker_mcp_server.__main__:main"
expense-tracker-create-user = "expense_tracker_mcp_server.cli.create_user:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
